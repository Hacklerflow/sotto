services:
  sotto-web:
    build: .
    environment:
      IDENTITY_DB_URL: postgres://sotto:${POSTGRES_PASSWORD:-sotto-dev}@sotto-identity-db:5432/sotto_identity
      ANSWER_DB_URL: postgres://sotto:${POSTGRES_PASSWORD:-sotto-dev}@sotto-answer-db:5432/sotto_answer
      ORIGIN: https://${SOTTO_DOMAIN:-localhost}
    expose:
      - "3000"
    depends_on:
      - sotto-identity-db
      - sotto-answer-db
    networks: [frontend, identity-net, answer-net]

  sotto-identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sotto-dev}
      POSTGRES_DB: sotto_identity
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks: [identity-net]

  sotto-answer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sotto-dev}
      POSTGRES_DB: sotto_answer
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - answer-data:/var/lib/postgresql/data
    networks: [answer-net]

  sotto-caddy:
    image: caddy:2-alpine
    environment:
      SOTTO_DOMAIN: ${SOTTO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - sotto-web
    networks: [frontend]

networks:
  frontend:
  identity-net:
  answer-net:

volumes:
  identity-data:
  answer-data:
  caddy-data:
